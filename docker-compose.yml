name: domochattsy-local

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-p", "${POSTGRES_PORT:?Set POSTGRES_PORT in .env}"]
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT:?Set POSTGRES_PORT in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -p "$${POSTGRES_PORT}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  rails:
    build:
      context: ./backend
      args:
        BUNDLE_WITHOUT: tools
    environment:
      RAILS_ENV: development
      DB_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:?Set POSTGRES_PORT in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      HACKATON_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      FRONTEND_PORT: ${FRONTEND_PORT:?Set FRONTEND_PORT in .env}
      API_PORT: ${API_PORT:?Set API_PORT in .env}
    command:
      - bash
      - -c
      - |
        set -e
        rm -f tmp/pids/server.pid
        ruby bin/rails db:prepare db:seed
        exec ruby bin/rails server -b 0.0.0.0 -p 9000
    ports:
      - "${BIND_ADDRESS:?Set BIND_ADDRESS in .env}:${API_PORT:?Set API_PORT in .env}:9000"
    volumes:
      - rails_storage:/rails/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/up"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${API_URL:?Set API_URL in .env}
    ports:
      - "${BIND_ADDRESS:?Set BIND_ADDRESS in .env}:${FRONTEND_PORT:?Set FRONTEND_PORT in .env}:80"
    depends_on:
      rails:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  postgres_data:
  rails_storage:
