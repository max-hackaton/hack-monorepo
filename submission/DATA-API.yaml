      status: active
    headers:
      Accept: application/json
  expected:
    status_codes:
    - 200
    content_type: application/json
    schema:
      $ref: openapi.yaml#/components/schemas/CasesResponse
    required_fields: &id005
    - cases
    - next_cursor
    assertions:
    - pointer: /cases/0/id
      equals: ${case_id}
