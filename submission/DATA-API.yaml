- id: invalid_origin
  description: Запись с постороннего Origin запрещена
  required: true
  role: resident
  operation_id: createCase
  request:
    method: POST
    path: /api/cases
    path_parameters: {}
    query: {}
    headers:
      Accept: application/json
      Origin: https://untrusted.example.invalid
      Content-Type: application/json
    body: ${data.public_case}
  expected:
    status_codes:
    - 403
    content_type: application/json
    schema:
      $ref: openapi.yaml#/components/schemas/Error
    required_fields: *id002
    assertions:
    - pointer: /error/code
      equals: invalid_origin
- id: create_public
  description: Создание публичной заявки
  required: true
  role: resident
  operation_id: createCase
  request:
    method: POST
    path: /api/cases
    path_parameters: {}
    query: {}
    headers:
      Accept: application/json
      Origin: ${origin}
      Content-Type: application/json
    body: ${data.public_case}
  expected:
    status_codes:
    - 201
    content_type: application/json
    schema:
      $ref: openapi.yaml#/components/schemas/CaseDetail
    required_fields: &id003
    - id
    - case_type
    - title
    - description
    - is_emergency
    - location_details
    - created_at
    - last_activity_at
    - confirmation_count
    - confirmed_by_me
    - can_confirm
    - visibility
    - house
    - current_step
    - violation_started_at
    - violation_ended_at
    - is_creator
    - photos
    - problem_key
    - classification
    - workflow
    assertions:
    - pointer: /current_step/status_key
      equals: new
    - pointer: /is_creator
      equals: true
    - pointer: /house/id
      equals: ${fixture.house_id}
  extract: &id007
    case_id: /id
    case_step: /current_step/key
    case_version: /workflow/version
    classification_version: /classification/version
    completed_step_key: /current_step/key
