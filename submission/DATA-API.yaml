    query: {}
    headers:
      Accept: application/json
  expected:
    statusCodes:
    - 401
    contentType: application/json
    bodySchema:
      allOf:
      - $ref: openapi.yaml#/components/schemas/Error
      - type: object
        required:
        - error
        properties:
          error:
            type: object
            required:
            - code
            properties:
              code:
                const: unauthenticated
    requiredFields:
    - error
  timeoutMs: 60000
  repeatable: true
  dependsOn:
  - health
