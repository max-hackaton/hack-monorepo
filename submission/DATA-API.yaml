    contentType: application/json
    bodySchema:
      allOf:
      - $ref: openapi.yaml#/components/schemas/CurrentUser
      - type: object
        required:
        - id
        properties:
          id:
            const: ${accounts.resident.user_id}
      - type: object
        required:
        - house
        properties:
          house:
            type: object
            required:
            - id
            properties:
              id:
                const: ${fixture.house_id}
