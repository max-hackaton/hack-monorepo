      problem_key: weak_heating
      description: 'Проверка API DATA-API: радиаторы в тестовой квартире недостаточно тёплые.'
      location_details: Тестовая квартира 42, спальня
      visibility: public
      is_emergency: false
      violation_started_at: '2026-09-27T00:00:00Z'
  expected:
