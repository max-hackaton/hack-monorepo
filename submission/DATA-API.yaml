- id: health
  name: Доступность приложения по HTTPS
  role: public
  method: GET
  path: /up
  request:
    path: {}
    query: {}
    headers:
      Accept: text/html
  expected:
    statusCodes:
    - 200
    contentType: text/html
  timeoutMs: 60000
  repeatable: true
- id: unauthenticated
