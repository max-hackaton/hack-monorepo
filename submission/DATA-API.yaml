schema_version: '1.0'
solution:
  name: Домочатцы
  team_id: max-hackaton
base_url: https://api.smirnov-web.ru
openapi_file: openapi.yaml
test_data_file: test-data.json
accounts_file: accounts.private.json
variables:
  origin: https://app.smirnov-web.ru
authentication:
  type: cookie
  name: max_session
  roles:
  - resident
  - neighbor
  - dispatcher
checks:
- id: health
  description: Доступность приложения по HTTPS
  required: true
  role: anonymous
  operation_id: getHealth
  request:
    method: GET
    path: /up
    path_parameters: {}
    query: {}
    headers:
      Accept: text/html
  expected:
    status_codes:
    - 200
    content_type: text/html
- id: unauthenticated
  description: Защищённый метод требует сессию
  required: true
  role: anonymous
  operation_id: getCurrentUser
  request:
    method: GET
    path: /api/auth/session
    path_parameters: {}
    query: {}
    headers:
      Accept: application/json
  expected:
    status_codes:
    - 401
    content_type: application/json
    schema:
      $ref: openapi.yaml#/components/schemas/Error
    required_fields: &id002
    - error
    assertions:
    - pointer: /error/code
      equals: unauthenticated
- id: session_resident
  description: 'Проверка тестовой сессии: resident'
  required: true
  role: resident
  operation_id: getCurrentUser
  request:
    method: GET
    path: /api/auth/session
    path_parameters: {}
    query: {}
    headers:
      Accept: application/json
  expected:
    status_codes:
    - 200
    content_type: application/json
    schema:
      $ref: openapi.yaml#/components/schemas/CurrentUser
    required_fields: &id001
    - id
    - max_user_id
    - first_name
    - last_name
    - photo_url
    - house
    - active_role
    - available_roles
    assertions:
    - pointer: /id
      equals: ${accounts.resident.user_id}
    - pointer: /house/id
      equals: ${fixture.house_id}
- id: role_resident
  description: 'Выбор режима: resident'
  required: true
  role: resident
  operation_id: selectSessionRole
  request:
    method: PATCH
    path: /api/auth/session
    path_parameters: {}
    query: {}
    headers:
      Accept: application/json
      Origin: ${origin}
      Content-Type: application/json
    body:
      role: resident
  expected:
    status_codes:
    - 200
    content_type: application/json
    schema:
      $ref: openapi.yaml#/components/schemas/CurrentUser
    required_fields: *id001
    assertions:
    - pointer: /active_role
      equals: resident
- id: session_neighbor
  description: 'Проверка тестовой сессии: neighbor'
  required: true
  role: neighbor
  operation_id: getCurrentUser
  request:
    method: GET
    path: /api/auth/session
    path_parameters: {}
    query: {}
    headers:
      Accept: application/json
  expected:
    status_codes:
    - 200
    content_type: application/json
    schema:
      $ref: openapi.yaml#/components/schemas/CurrentUser
    required_fields: *id001
    assertions:
    - pointer: /id
      equals: ${accounts.neighbor.user_id}
    - pointer: /house/id
      equals: ${fixture.house_id}
- id: role_neighbor
  description: 'Выбор режима: resident'
  required: true
  role: neighbor
  operation_id: selectSessionRole
  request:
    method: PATCH
    path: /api/auth/session
    path_parameters: {}
    query: {}
    headers:
      Accept: application/json
      Origin: ${origin}
      Content-Type: application/json
    body:
      role: resident
  expected:
    status_codes:
    - 200
    content_type: application/json
    schema:
      $ref: openapi.yaml#/components/schemas/CurrentUser
    required_fields: *id001
    assertions:
    - pointer: /active_role
      equals: resident
- id: session_dispatcher
  description: 'Проверка тестовой сессии: dispatcher'
  required: true
  role: dispatcher
  operation_id: getCurrentUser
  request:
    method: GET
    path: /api/auth/session
    path_parameters: {}
    query: {}
    headers:
      Accept: application/json
  expected:
    status_codes:
    - 200
    content_type: application/json
    schema:
      $ref: openapi.yaml#/components/schemas/CurrentUser
    required_fields: *id001
    assertions:
    - pointer: /id
      equals: ${accounts.dispatcher.user_id}
    - pointer: /house/id
      equals: ${fixture.house_id}
- id: role_dispatcher
  description: 'Выбор режима: dispatcher'
