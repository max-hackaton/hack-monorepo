        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: No assigned management company (dispatch_forbidden), or untrusted
            Origin for writes (invalid_origin)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Case is missing or outside assigned companies (not_found)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9]+$"
        description: ''
  "/api/dispatch/cases/{case_id}/photos/{id}":
