  "/api/dispatch/companies":
    get:
      operationId: listDispatchCompanies
      summary: List assigned management companies
      description: Returns current staff assignments ordered by company name and ID.
        No selected house or MAX chat membership is required. A session without assignments
        receives 403 dispatch_forbidden.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: List assigned management companies
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DispatchCompaniesResponse"
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: No assigned management company (dispatch_forbidden), or untrusted
            Origin for writes (invalid_origin)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /api/dispatch/houses:
    get:
      operationId: listDispatchHouses
      summary: List houses managed by the dispatcher's companies, including houses without cases
      description: Does not require resident chat membership or a selected session house. Includes currently managed houses and houses containing cases assigned to the dispatcher's companies, preserving access after a house changes company. Returns up to 100 houses ordered by ID. Membership is checked on every request.
      security:
      - sessionCookie: []
      parameters:
      - name: after_id
        in: query
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      responses:
        '200':
          description: Available houses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchHousesResponse'
        '400':
          description: Invalid pagination ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No management company membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/dispatch/house-selection:
    get:
      operationId: getDispatchHouseSelection
      summary: Read the current dispatcher's saved working houses
      description: >-
        Returns the selected houses still accessible through the dispatcher's companies, ordered by ID.
        The selection belongs to the user and persists across sessions. It does not grant access or change
        resident house membership. Initially empty, except when selecting the dispatcher role
        initializes it with the accessible current house belonging to the demo company. This GET never
        changes the selection; an explicitly cleared selection stays empty until another role selection.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Saved working houses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchHouseSelectionResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No current management company membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateDispatchHouseSelection
      summary: Replace the current dispatcher's working houses
      description: Atomically replaces the list. Every house must be accessible to the dispatcher. Duplicate IDs are normalized; an empty array clears the selection. Requires a trusted Origin. Other dispatchers' selections and resident memberships are unchanged.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [house_ids]
              properties:
                house_ids:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
                    pattern: ^[1-9][0-9]*$
      responses:
        '200':
          description: Saved working houses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchHouseSelectionResponse'
        '400':
          description: Missing or malformed house IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No current membership, an inaccessible house, or an untrusted Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: JSON body required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/dispatch/cases:
    get:
      operationId: listDispatchCases
      summary: List cases assigned to the dispatcher
      description: Requires a signed session and current management-company membership. Access follows the
        management_company_id stored on the Case, including private and completed Cases. No selected house
        or MAX chat membership is required. Cases without a company are excluded. Returns at most 20 Cases
        ordered by created_at descending, then ID descending. Filters are combined. Signed cursors bind
        the user, current assignment set and normalized filters. Pagination is not a snapshot. can_confirm
        is always false.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: List cases assigned to the dispatcher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchCasesResponse'
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No assigned management company (dispatch_forbidden), or untrusted Origin for writes
            (invalid_origin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Malformed filters (invalid_request), or invalid or mismatched cursor (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: house_ids[]
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            pattern: ^[1-9][0-9]*$
        description: Repeat house_ids[] for each house ID. Applied before pagination; any inaccessible house returns 403. Order and duplicates are normalized, and cursors bind the resulting house set.
      - name: management_company_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
        description: An unassigned company returns 403 dispatch_forbidden.
      - name: created_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Inclusive creation timestamp, strict RFC3339 with an explicit timezone.
      - name: created_to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Exclusive creation timestamp, strict RFC3339 with an explicit timezone. Must be later
          than created_from.
      - name: is_emergency
        in: query
        required: false
        schema:
          type: boolean
        description: Resident emergency mark filter; serialized as exactly true or false.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque next_cursor from the previous page with the same filters.
      - name: classification_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - confirmed
        description: Filter by dispatcher confirmation state, independently of workflow status.
      - name: status_key
        in: query
        required: false
        schema:
          type: string
          enum: [new, in_progress, action_required, closed_by_executor, awaiting_recalculation, completed]
        description: Filter by one current workflow status across case types, before pagination. Kept for existing clients; cannot be combined with status_keys[].
      - name: status_keys[]
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            enum: [new, in_progress, action_required, closed_by_executor, awaiting_recalculation, completed]
        description: Repeat status_keys[] for each selected workflow status. Matches any selected status before pagination; duplicates and order are normalized for cursors. Cannot be combined with status_key.
  "/api/dispatch/cases/{id}":
    get:
      operationId: getDispatchCase
      summary: Read a case as its assigned dispatcher
      description: Requires a signed session and current management-company membership.
        Access follows the management_company_id stored on the Case, including private
