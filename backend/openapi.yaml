openapi: 3.1.0
info:
  title: MAX Mini App API
  version: 1.0.0
  description: >-
    API for the MAX Mini App, a web application that runs inside the MAX mobile app. It uses a
    session cookie to authenticate users and provide access to their house's public Case feed. The
    API verifies MAX launch data signatures and stores verified real-house membership in user_houses.
    Verified memberships are checked locally. Discovered unverified memberships are automatically
    verified through MAX when accessing the selected house; login also verifies membership.
    user_removed webhooks revoke access across sessions. The backend automatically selects
    and adds the shared demo house when the session has no accessible selected house. It also grants
    MAX users membership in the demo house's management company on login and session restoration.
    MAX errors return 503 without granting fallback access. The selected resident or dispatcher
    role is stored in the server session; dispatcher availability requires company membership.
paths:
  /max/webhook:
    post:
      operationId: receiveMaxBotUpdate
      summary: Receive MAX bot and membership updates
      description: Authenticated with X-Max-Bot-Api-Secret, not a user session. Subscribed to bot_added,
        bot_admin_permissions_changed, user_added, user_removed, message_created and bot_started. Group bot_added and group
        bot_admin_permissions_changed with is_admin=true find or create a house by chat_id with a placeholder address
        "Демо-дом чата <chat_id>". Newly created houses belong to the shared demo
        management company and are available to its dispatchers; new cases inherit this company.
        Existing houses, their company assignments and cases are unchanged. It then sends the welcome message
        and pins it when permitted. The welcome button includes payload house_<id> so the login selects
        this house even without chat context. This house requires verified chat membership like any real house.
        Group user_added rechecks
        MAX membership and restores access for an existing user and house. Group user_removed deletes the user-house
        link and clears the selected house across all user sessions synchronously; the user and case history remain.
        Membership webhook handling then selects the shared demo house for empty sessions.
        Removals older than a later successful membership check are ignored. Repeated membership deliveries are safe;
        repeated bot_added or admin permission deliveries reuse the house but may resend the welcome message.
        Admin permission updates with is_admin=false and channels are ignored;
        membership updates for unknown users or houses are ignored. Revocation takes effect for subsequent
        authorization checks; already authorized requests may finish.
        Private messages and bot_started receive a welcome with an app button. Group messages receive
        a reply only when they mention this bot by ID or username; the button selects the registered
        house when available. These replies are not pinned and do not create houses or memberships.
        Messages from bots and channels are ignored. Group message updates require administrator
        permission read_all_messages. Repeated message or start deliveries may resend the welcome.
      security:
      - maxWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required: [update_type, timestamp, chat_id, user]
                properties:
                  update_type:
                    type: string
                    const: bot_started
                  timestamp:
                    type: integer
                    format: int64
                  chat_id:
                    type: integer
                    format: int64
                  user:
                    type: object
                    required: [user_id]
                    properties:
                      user_id:
                        type: integer
                        format: int64
                additionalProperties: true
              - type: object
                required: [update_type, timestamp, message]
                properties:
                  update_type:
                    type: string
                    const: message_created
                  timestamp:
                    type: integer
                    format: int64
                  message:
                    type: object
                    required: [recipient, timestamp, body]
                    properties:
                      sender:
                        type: [object, 'null']
                        properties:
                          user_id:
                            type: integer
                            format: int64
                          is_bot:
                            type: boolean
                      recipient:
                        type: object
                        required: [chat_type]
                        properties:
                          chat_id:
                            type: [integer, 'null']
                            format: int64
                          user_id:
                            type: [integer, 'null']
                            format: int64
                          chat_type:
                            type: string
                            enum: [dialog, chat, channel]
                      timestamp:
                        type: integer
                        format: int64
                      body:
                        type: [object, 'null']
                        properties:
                          mid:
                            type: string
                          text:
                            type: [string, 'null']
                          markup:
                            type: [array, 'null']
                            items:
                              type: object
                              required: [type, from, length]
                              properties:
                                type:
                                  type: string
                                from:
                                  type: integer
                                length:
                                  type: integer
                                user_id:
                                  type: [integer, 'null']
                                  format: int64
                                user_link:
                                  type: [string, 'null']
                additionalProperties: true
              - type: object
                required:
                - update_type
                - chat_id
                - is_channel
                properties:
                  update_type:
                    type: string
                    const: bot_added
                  chat_id:
                    type: integer
                    format: int64
                  is_channel:
                    type: boolean
                additionalProperties: true
              - type: object
                required:
                - update_type
                - timestamp
                - chat_id
                - user_id
                - bot_id
                - is_channel
                - is_admin
                properties:
                  update_type:
                    type: string
                    const: bot_admin_permissions_changed
                  timestamp:
                    type: integer
                    format: int64
                  chat_id:
                    type: integer
                    format: int64
                  user_id:
                    type: integer
                    format: int64
                  bot_id:
                    type: integer
                    format: int64
                  is_channel:
                    type: boolean
                  is_admin:
                    type: boolean
                  permissions:
                    type: [array, "null"]
                    items:
                      type: string
                additionalProperties: true
              - type: object
                required:
                - update_type
                - timestamp
                - chat_id
                - user
                - is_channel
                properties:
                  update_type:
                    type: string
                    enum:
                    - user_added
                    - user_removed
                  timestamp:
                    type: integer
                    format: int64
                    minimum: 1
                    description: MAX event time in Unix milliseconds
                  chat_id:
                    type: integer
                    format: int64
                  user:
                    type: object
                    required:
                    - user_id
                    properties:
                      user_id:
                        type: integer
                        format: int64
                    additionalProperties: true
                  is_channel:
                    type: boolean
                additionalProperties: true
      responses:
        '200':
          description: Update handled or intentionally ignored
        '400':
          description: Malformed JSON or missing required update fields
        '401':
          description: Missing or incorrect webhook secret
        '503':
          description: MAX error or timeout while checking restored access or sending the welcome message; MAX may
            retry
  /api/auth/session:
    post:
      operationId: authenticateMax
      summary: Verify MAX initData and create or rotate a user session with optional house context
      description: >-
        Production requires signed MAX initData, including when hosted locally. The exact
        init_data value __DEV_USER__ is accepted only by a Rails development backend. It creates
        or reuses max_user_id demo_resident (Иван Смирнов) without a MAX bot token and selects
        the shared demo house. Development and production seeds use identical houses and scenarios.
        The development account can access only synthetic demo houses. Its dispatcher access is
        restricted to the demo company and denied if that company contains real houses or cases.
        Production rejects its cookies and all unsigned development or demo markers. The old
        __DEV_RESIDENT__, __DEV_DISPATCHER__ and __DEMO_USER__ markers are rejected everywhere.
        Login does not select a role. A new login rotates the session cookie and invalidates
        the previous token.
        All POST requests still require a
        trusted Origin. Other values follow the normal MAX signature and timestamp verification. A
        signed chat.id is matched to houses.max_chat_id, then live chat membership is checked.
        A signed start_param of the form house_<id> selects that house after checking its chat
        membership through MAX, even without chat context or when launched from another chat.
        An unknown house or a user who is not a member does not gain access from this parameter.
        A signed start_param of the form case_<id> instead selects the public Case's house after
        checking membership through MAX, even without chat context or when launched from another chat.
        An unknown or private Case does not grant house access. The frontend opens /cases/<id>
        after authentication; the normal Case access checks still apply. A
        verified chat launch with confirmed membership selects that real house and records it in the
        user's houses with verified_at. Signed login rechecks MAX even for an existing link. A verified MAX user without an accessible
        launch house instead selects the shared demo house, which is also recorded in discovered
        houses. This includes a launch without a chat.id or one whose chat has no linked house or
        confirmed membership. Login also grants every verified MAX user membership in the demo
        house's management company, including users with a real selected house. Both resident and
        dispatcher modes are then available; other companies still require their own membership.
        A new session
        replaces the previous session and its house selection. When a valid session cookie belongs
        to the same verified user, its active_role is preserved if the role is still available.
        First login, login after logout, an expired or missing cookie, a different MAX account,
        or a role that is no longer available results in active_role=null.
        MAX initData and the development login marker never select a role. Demo fallback never bypasses MAX
        launch data verification, and an unavailable MAX membership service still returns 503 when a
        real house check is required. Send init_data through JSON, form or query parameters.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaxLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaxLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaxLogin'
      responses:
        '200':
          description: Authenticated user with a restored or unselected active_role; HttpOnly session cookie expires in 30 days
          headers:
            Set-Cookie:
              description: Opaque max_session cookie; Secure, SameSite=None and Partitioned in production, Path=/, no Domain
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          description: Missing init_data or invalid request parameters (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            Invalid MAX signature, expired or malformed launch data (including duplicate fields),
            a legacy development marker, or the development marker outside development (invalid_max_data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing, null or untrusted Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: >-
            Request body exceeds the reverse proxy limit of 55 MiB (57671680 bytes); response format
            is proxy-specific.
        '503':
          description: MAX API error or timeout while checking chat membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: init_data
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxLogin/properties/init_data'
    get:
      operationId: getCurrentUser
      summary: Restore current user, selected role and accessible house from the session cookie
      description: >-
        Verified selected memberships are checked locally. An existing unverified membership is
        checked through MAX and stored as verified on success. A negative check revokes that house
        across sessions. A missing or inaccessible selection automatically falls back to the shared
        demo house. Development accounts use the same demo house only in development. MAX errors return 503 without fallback.
        MAX users also join the demo house's management company, including
        existing sessions with an accessible selected house. Development accounts keep their seeded access.
        active_role is stored in this session; available_roles reflects current company access.
        Revoked real-company membership does not revoke demo-company access. Available roles are derived from
        current accessible company memberships.
      security:
      - sessionCookie: []
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Missing, invalid, revoked or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: selectSessionRole
      summary: Select the active role for the current session
      description: >-
        Requires a valid max_session cookie and trusted Origin. Resident is available to every
        authenticated user. Dispatcher requires a current management company membership.
        The active role affects only this session and does not grant house or dispatch access.
        Selecting dispatcher also initializes an empty saved working-house selection
        with the current session house when it belongs to the demo company and is accessible to the dispatcher.
        Existing saved selections are preserved. Selecting resident and reading the session do not initialize it.
        House recovery follows GET session; a failed recovery does not change the role.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectSessionRole'
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Current user with the selected active_role and current available_roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          description: Missing or invalid role (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, revoked or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Dispatcher membership required (dispatch_forbidden), or untrusted Origin (invalid_origin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: logout
      summary: Revoke the current session and expire the cookie
      description: Idempotent. Does not revoke sessions on other devices. Send no request body.
      security:
      - sessionCookie: []
      - {}
      responses:
        '204':
          description: Session revoked (or already absent) and cookie expired
          headers:
            Set-Cookie:
              description: Expires max_session with matching cookie attributes, including both partitioned and legacy cookies in production
              schema:
                type: string
        '403':
          description: Missing, null or untrusted Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/session/house:
    put:
      operationId: selectSessionHouse
      summary: Select a previously discovered house for the current session
      description: >-
        Requires a valid session, including one with house=null. The house must be in the current
        user's house list. Verified real-house links are checked locally; legacy links are verified once through MAX.
        The shared demo house does not require a chat
        membership check. A failed legacy check removes the stale link and clears that house across sessions. Send a
        trusted Origin. Supply house_id through JSON, form or query parameters.
      security:
      - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectHouse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectHouse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectHouse'
      responses:
        '200':
          description: Current user with newly selected house
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          description: Missing house_id or invalid request parameters (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            House access denied (no_house_access), or untrusted Origin
            (invalid_origin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: House is not in the current user's discovered list (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Legacy MAX membership check unavailable (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: house_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SelectHouse/properties/house_id'
  /api/houses:
    get:
      operationId: listDiscoveredHouses
      summary: List houses previously discovered by the current user
      description: >-
        Works with any valid session, including house=null. Houses come from user_houses and are
        ordered by id. user_removed removes the corresponding house from this list. Legacy links
        without verified_at remain discoverable and are verified when selecting or accessing that
        house. Listing houses does not call MAX, create memberships or change
        the selected house. The development account lists only synthetic demo houses.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Discovered houses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HousesResponse'
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/home:
    get:
      operationId: getHome
      summary: Get the active public and own private Case feed for the session house
      description: >-
        Requires access to the selected real or demo house. An unverified discovered membership is
        automatically verified through MAX. A missing or inaccessible selection falls back to the
        shared demo house, following GET session. The page contains at most
        20 Case records. With sort=activity, the feed includes public Cases and private
        Cases created by the current user. With sort=confirmations, it includes only
        public Cases. Private Cases of other residents are always excluded.
        active_cases_count includes every active Case visible to this user in the selected
        house, independent of sort and page size. A Case with current_step.status_key=completed is excluded; a Case with
        closed_by_executor remains active. last_activity_at is the latest case_events.occurred_at,
        falling back to cases.created_at. Changes between page requests can move records
        because pagination does not hold a snapshot.
      security:
        - sessionCookie: []
      parameters:
        - name: sort
          in: query
          required: false
          description: Defaults to activity. The confirmations sort excludes private Cases.
          schema:
            type: string
            enum: [activity, confirmations]
            default: activity
        - name: cursor
          in: query
          required: false
          description: Opaque next_cursor from a previous response with the same user, sort and house.
          schema:
            type: string
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Home feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '400':
          description: Invalid sort or cursor (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No accessible house in this session (no_house_access)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/case-types:
    get:
      operationId: listCaseTypes
      summary: List the available Case types for creating a Case
      description: >-
        Requires an authenticated session and access to the selected house,
        including demo-house access. Returns the global catalog in the
        order heating, elevator, yard, leak, hot_water, cold_water, electricity,
        other. Legacy demo aliases are excluded. Use a type's key to fetch its
        constructor and workflow steps.
      security:
        - sessionCookie: []
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Ordered Case type catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseTypesResponse'
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No accessible house in this session (no_house_access)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/case-types/{key}:
    get:
      operationId: getCaseType
      summary: Get the constructor and workflow steps for a Case type
      description: >-
        Requires an authenticated session and access to the selected house, including enabled
        demo-house access. Steps are ordered by sort_order. A known type without steps returns an
        empty steps array, but cannot be used to create a Case. The frontend uses step key and kind;
        step database IDs are not exposed. Render only the returned constructor fields: problem
        and, where needed, location. Elevator location is fixed in the template. Filter location
        options by their optional problem_keys and clear a selection made unavailable by a problem
        change. Options with input_label require nonblank user wording after their text prefix.
        Replace each {field_key} in description_template with the resulting fragment, allow manual
        edits and submit the final description. Structured answers are not submitted or stored;
        the backend does not regenerate the text. Capture the start time separately through the
        optional violation_started_at field, without inferring it from constructor answers or
        automatically inserting it into the description.
      security:
      - sessionCookie: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Case type, description constructor and ordered workflow steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseType'
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No accessible house in this session (no_house_access)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Case type does not exist (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cases:
    get:
      operationId: listCases
      summary: List Cases created by or subscribed to by the current user
      description: >-
        Requires an authenticated session and access to the selected house, including stored verified
        membership for real houses and demo-house access. The default mine scope
        returns the current user's public and private Cases in that house. The subscriptions scope
        returns public Cases in that house that the current user has confirmed using the existing
        confirmation action. Both scopes include completed Cases unless status filters them. The Case status belongs to its
        author's workflow; subscribers do not have a separate lifecycle. Results are ordered by
        latest event or record update descending, then Case ID descending, with at most 20 records per page.
        Pagination is not a snapshot: Cases can move between pages as new activity occurs. Cursors
        are opaque, signed and bound to the current user, selected house, scope and status filter.
      security:
      - sessionCookie: []
      parameters:
      - name: scope
        in: query
        required: false
        description: Choose Cases created by the current user or public Cases they have confirmed.
        schema:
          type: string
          enum:
          - mine
          - subscriptions
          default: mine
      - name: status
        in: query
        required: false
        description: Filter active or completed Cases before pagination; omit to include both.
        schema:
          type: string
          enum:
          - active
          - completed
      - name: cursor
        in: query
        required: false
        description: >-
          Opaque next_cursor from the previous page for this user, house, scope and status filter; omit for the
          first page.
        schema:
          type: string
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Page of Cases for the selected scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesResponse'
        '400':
          description: >-
            Unsupported scope or status (invalid_request), or cursor cannot be verified for this user, house,
            scope and status filter (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No accessible house in this session (no_house_access)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createCase
      summary: Create a public or private Case in the session house
      description: >-
        Uses the authenticated user as creator and the accessible session house, including the
        shared demo house. The backend selects the first step by sort_order. Creating
        the Case and its case_created event is atomic. Additional request fields are ignored; the
        client cannot override the house, creator or current step. The description is the final
        edited text from the frontend. Choose public to include it in the house feed and queue a
        message to the real house's MAX chat after commit. The message contains the Case number,
        category, up to 3000 description characters and an open_app button with payload case_<id>.
        Publication is asynchronous: 201 confirms Case creation, not delivery to MAX. Private Cases
        and synthetic demo, development or load-test houses are never published. Send typed fields
        in a JSON object or multipart form body and use a trusted Origin. Query parameters are not
        used for creation. is_emergency defaults to false; malformed field types return 400.
        Upload optional photos as multipart photos[] files. Signed blob IDs and direct uploads are
        not supported; photos use protected Case URLs.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCase'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCaseWithPhotos'
            encoding:
              photos:
                contentType: image/jpeg, image/png, image/webp, image/heic, image/heif
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Case created
          headers:
            Location:
              description: Absolute URL of the created Case
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '400':
          description: Malformed JSON or request parameters (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing house access (no_house_access) or untrusted Origin (invalid_origin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Case type does not exist (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: >-
            Request body exceeds the reverse proxy limit of 55 MiB (57671680 bytes), including
            multipart overhead; response format is proxy-specific
        '422':
          description: >-
            Required Case fields, workflow step, visibility, emergency flag, violation interval or
            photo constraints fail validation (invalid_record)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cases/{id}:
    get:
      operationId: getCase
      summary: Get a Case visible to the current user in the session house
      description: >-
        Public Case records are visible to members of their house. Private Case records are visible
        only to their creator on this resident route, who must still have access to the selected
        house. Completed Case records remain readable. Records from another house and private
        records belonging to another user are not revealed. Uses the same stored membership and
        demo-house access checks as the home feed.
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No accessible house in this session (no_house_access)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Case is missing or inaccessible to the current user in the selected house (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cases/{case_id}/photos/{id}:
    get:
      operationId: getCasePhoto
      summary: Read a photo attached to an accessible Case
      description: >-
        Requires the same authenticated session, stored verified house membership or demo-house access,
        and Case visibility checks as Case detail. Public Case photos are visible to members of
        their house; private Case photos are visible only to the creator through this resident route
        while they have house access. Completed Case photos remain readable. The response returns
        the original image through this protected route without exposing a public Active Storage
        URL.
      security:
      - sessionCookie: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Original photo
          headers:
            Cache-Control:
              description: Prevents caching of protected photo contents.
              schema:
                type: string
                const: no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/heic:
              schema:
                type: string
                format: binary
            image/heif:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No accessible house in this session (no_house_access)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Case is missing or inaccessible, or the photo is not attached to that Case (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cases/{id}/confirmations:
    post:
      operationId: confirmCase
      summary: Confirm that an active public Case affects the current user too
      description: >-
        Uses the authenticated user and session house, including the shared demo house. Send no request body. Repeated requests are idempotent, with one
        confirmation per Case and user. Private Case records and Case records from another house are
        not revealed. This is also the subscription action: after success the Case appears in GET
        /api/cases?scope=subscriptions. Subscriptions reuse confirmations; there is no separate
        subscription resource or unsubscribe action. New confirmations remain disallowed for the
        creator and for completed Cases. An existing confirmation remains valid after completion, so
        the Case stays in the subscriptions list with its author's current workflow status.
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Case confirmed or already confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
        '401':
          description: Missing or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing house access (no_house_access) or untrusted Origin (invalid_origin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Public Case is missing or is not in the selected house (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            The creator cannot confirm their own Case, the Case is completed or validation fails
            (invalid_record)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cases/{case_id}/events:
    get:
      operationId: listResidentCaseEvents
      summary: Read Case history as a resident
      description: >-
        Requires access to the selected house through stored verified membership or demo-house
        checks. Public Cases are readable by house members; private Cases only by their creator.
        Events are ordered by occurred_at descending, then id descending, with at most 50 per page.
        Only the creator can read notes; neighbors see non-message events of public Cases.
        Visibility is filtered before pagination. Completed Case history remains readable. The
        signed cursor is bound to the Case, user and creator or neighbor access mode. Poll the first
        page for recent events and merge by event ID; use next_cursor for older history. Pagination
        is not a snapshot.
      security:
      - sessionCookie: []
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Read Case history as a resident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseEventsResponse'
        '401':
          description: Missing, invalid or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No accessible selected house (no_house_access)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: >-
            Cursor cannot be verified for this Case, user and access mode (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Case is missing or inaccessible to the current user in the selected house (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: >-
          Opaque next_cursor for this Case, user and access mode; omit for the newest page.
  /api/cases/{case_id}/messages:
    post:
      operationId: createResidentCaseMessage
      summary: Add a Case note as its creator
      description: >-
        Requires an accessible selected house and ownership of the Case. Supply body through
        Rails-parsed JSON, form or query parameters and send a trusted Origin. The backend assigns
        the authenticated actor and sender_role resident. The note is stored as a message_added
        CaseEvent and is visible to the creator and authorized dispatchers. For legacy Cases in
        action_required without a recorded clarification question, a valid note atomically returns
        the Case to in_progress, increments workflow_version and adds a status_changed event.
        For Cases with recorded questions, notes do not change the workflow; use the versioned
        answer_clarification action to answer a question.
        Completed Cases reject new notes. Repeated
        POST requests create separate notes.
      security:
      - sessionCookie: []
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Message added to the Case history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseEvent'
        '401':
          description: Missing, invalid or expired session (unauthenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            No accessible selected house (no_house_access), or untrusted Origin (invalid_origin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Missing body or invalid request parameters (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Case is missing, is in another house or is not owned by the current user (not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Case is completed or note validation fails (invalid_record)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
      - name: body
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateCaseMessage/properties/body'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCaseMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCaseMessage'
  "/api/cases/{case_id}/status":
    patch:
      operationId: updateResidentCaseStatus
      summary: Change a Case workflow step as the resident creator
      description: Requires ownership, selected house access, a trusted Origin and a
        JSON body with step_key and expected_workflow_version from workflow.version.
        Only closed_by_executor can confirm repair (completed without a route, otherwise
        awaiting_recalculation) or reject it (in_progress). Other transitions return
        422. Stale versions return 409. No action creates another case. Use the actions
        endpoint for clarification and billing decisions.
      security:
      - sessionCookie: []
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '200':
          description: Change a Case workflow step as the resident creator
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CaseDetail"
        '401':
          description: Missing, invalid or expired session (unauthenticated)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: No accessible selected house (no_house_access), or untrusted
            Origin (invalid_origin)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          description: Missing step_key or invalid request parameters (invalid_request)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Case is missing, is in another house, is not owned by the current
            user, or the step is not defined for this Case type (not_found)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Case or event validation failure (invalid_record)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Stale workflow version (conflict)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ChangeCaseStatus"
    put:
      operationId: replaceResidentCaseStatus
      summary: Change a Case workflow step as the resident creator
      description: Requires ownership, selected house access, a trusted Origin and a
        JSON body with step_key and expected_workflow_version from workflow.version.
        Only closed_by_executor can confirm repair (completed without a route, otherwise
        awaiting_recalculation) or reject it (in_progress). Other transitions return
        422. Stale versions return 409. No action creates another case. Use the actions
        endpoint for clarification and billing decisions.
      security:
      - sessionCookie: []
      responses:
        '503':
          description: MAX API error or timeout while verifying house membership (max_unavailable)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '200':
          description: Change a Case workflow step as the resident creator
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CaseDetail"
        '401':
          description: Missing, invalid or expired session (unauthenticated)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: No accessible selected house (no_house_access), or untrusted
            Origin (invalid_origin)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          description: Missing step_key or invalid request parameters (invalid_request)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Case is missing, is in another house, is not owned by the current
            user, or the step is not defined for this Case type (not_found)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Case or event validation failure (invalid_record)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Stale workflow version (conflict)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
