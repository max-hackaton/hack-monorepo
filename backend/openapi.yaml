        name: action
        required: true
        schema:
          $ref: '#/components/schemas/CaseActionName'
      - in: query
        name: expected_current_step_key
        required: true
        schema:
          type: string
      - in: query
        name: expected_workflow_version
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Prepared action form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentActionForm'
        '400':
          description: Missing or malformed query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Selected house access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Case is not owned by the caller in the selected house.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Observed step or workflow version is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Action is not currently available to the resident.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: MAX membership verification unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  "/api/dispatch/cases/{case_id}/action-form":
