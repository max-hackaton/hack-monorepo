  "/api/cases/{case_id}/actions":
    post:
      operationId: performResidentCaseAction
      summary: Perform an authorized resident case action
      description: Use workflow.available_actions from CaseDetail and the observed current_step.key
        plus workflow.version as expected_workflow_version. Requires a trusted Origin.
        State and history are saved atomically. Clarifications are private to the creator
        and assigned company. Repair confirmation completes without a billing route
        or creates a pending billing attempt and submits via the adapter. Adapter failures
        persist as failed attempts and return the same case to in_progress with billing_failed.
        Retry creates a new attempt. resume_recalculation resubmits the same pending
        attempt using its stable idempotency key after an interrupted process. Recalculation
        confirmation is allowed only after a submitted receipt. No action creates another
        case. Billing adapters simulate UK/RKC in the MVP; no external billing API is
        connected.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: case_id
        required: true
        schema:
          type: string
          pattern: "^[0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PerformCaseAction"
      responses:
        '200':
          description: Updated case, including durable adapter failure state when submission
            fails.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CaseDetail"
        '400':
          description: Missing or malformed action/expected step.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Trusted Origin, house access or dispatcher membership required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Case not accessible to the caller.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: The observed current step changed; refresh before retrying.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '415':
          description: JSON body required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Action not allowed, invalid clarification or missing retry route.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: MAX membership verification unavailable; no workflow action was
            performed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/cases/{case_id}/action-form":
    get:
      operationId: getResidentCaseActionForm
      summary: Prepare an available resident action without changing the case
      description: Only the case creator may prepare an action offered by workflow.available_actions.
        The observed step and workflow version must match the current case.
        For answer_clarification, context contains the latest dispatcher question as plain text
        to display above the answer field. Preparing the form does not change clarification history.
