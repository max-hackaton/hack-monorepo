components:
  securitySchemes:
    maxWebhookSecret:
      type: apiKey
      in: header
      name: X-Max-Bot-Api-Secret
    sessionCookie:
      type: apiKey
      in: cookie
      name: max_session
      description: Set by backend, sent by browser; frontend never reads this HttpOnly cookie
  schemas:
    SelectSessionRole:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [resident, dispatcher]
    SelectHouse:
      type: object
      required:
      - house_id
      properties:
        house_id:
          type: string
    HousesResponse:
      type: object
      additionalProperties: false
      required: [houses]
      properties:
        houses:
          type: array
          items:
            $ref: '#/components/schemas/House'
    MaxLogin:
      type: object
      required:
      - init_data
      properties:
        init_data:
          type: string
          minLength: 1
          description: >-
            Exact unmodified window.WebApp.initData string, or the single __DEV_USER__ bypass in
            development only. The
            backend verifies the MAX HMAC-SHA256 signature and auth_date (maximum age 3600 seconds,
            future clock skew up to 30 seconds). The development marker needs no MAX bot token and
            is rejected outside Rails development. It does not select a role.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, max_user_id, first_name, last_name, photo_url, house, active_role, available_roles]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        max_user_id:
          type: string
          pattern: '^(?:[0-9]+|demo_resident)$'
          description: >-
            Verified MAX user.id serialized as a string to preserve precision, or demo_resident for local
            development login
        first_name:
          type: [string, 'null']
        last_name:
          type: [string, 'null']
        photo_url:
          type: [string, 'null']
          format: uri
        active_role:
          type: [string, 'null']
          enum: [resident, dispatcher, null]
          description: Selected mode of this server session; null until the user chooses one.
        available_roles:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            enum: [resident, dispatcher]
          description: >-
            Resident is always present; dispatcher requires a current company membership.
            MAX users automatically join the demo house's company on login
            and session restoration. The development account joins the same demo company with access restricted to demo data.
        house:
          oneOf:
            - $ref: '#/components/schemas/House'
            - type: 'null'
          description: >-
            Selected and currently accessible real or demo house, or null when the session
            has no selected house or the selected house is inaccessible.
    House:
      type: object
      additionalProperties: false
      required: [id, full_address]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        full_address:
          type: string
          description: Display address. Auto-generated demo chat names shorten chat IDs to the first three digits and an ellipsis.
    HomeViewer:
      type: object
      additionalProperties: false
      required: [first_name, last_name, photo_url]
      properties:
        first_name:
          type: [string, 'null']
          description: Null when the profile has no photo.
        last_name:
          type: [string, 'null']
        photo_url:
          type: [string, 'null']
          format: uri
    HomeCase:
      type: object
      additionalProperties: false
      required:
        - id
        - case_type
        - title
        - description
        - visibility
        - is_emergency
        - location_details
        - created_at
        - last_activity_at
        - confirmation_count
        - confirmed_by_me
        - can_confirm
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        case_type:
          type: object
          additionalProperties: false
          required: [key, name]
          properties:
            key:
              type: string
            name:
              type: string
        title:
          type: string
          description: Server-derived title from the current problem option text, falling back to the case type name for legacy or free-text problems.
        description:
          type: string
        is_emergency:
          type: boolean
          description: Whether the resident marked this Case as an emergency.
        location_details:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        confirmation_count:
          type: integer
          minimum: 0
          description: Number of subscribers, excluding the Case creator.
        confirmed_by_me:
          type: boolean
        can_confirm:
          type: boolean
          description: Always false for private Cases and Cases created by the current user.
        visibility:
          type: string
          enum: [public, private]
          description: Private Cases are returned only to their creator.
    CaseListItem:
      type: object
      additionalProperties: false
      required:
      - id
      - case_type
      - title
      - description
      - is_emergency
      - location_details
      - created_at
      - last_activity_at
      - confirmation_count
      - confirmed_by_me
      - can_confirm
      - visibility
      - current_step
      - is_creator
      - problem_key
      - classification
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
        case_type:
          type: object
          additionalProperties: false
          required:
          - key
          - name
          properties:
            key:
              type: string
            name:
              type: string
        title:
          type: string
          description: Server-derived title from the current problem option text, falling back to the case type name for legacy or free-text problems.
        description:
          type: string
        is_emergency:
          type: boolean
          description: Whether the resident marked this Case as an emergency.
        location_details:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
          description: Latest Case event time, falling back to the Case creation time.
        confirmation_count:
          type: integer
          minimum: 0
          description: Number of subscribers, excluding the Case creator.
        confirmed_by_me:
          type: boolean
        can_confirm:
          type: boolean
          description: True only for an active public Case created by another user that the current user has
            not confirmed.
        visibility:
          type: string
          enum:
          - public
          - private
        current_step:
          $ref: '#/components/schemas/Step'
          description: Current step in the author's workflow, shared with all subscribers.
        is_creator:
          type: boolean
          description: Whether the authenticated user created this Case and owns its workflow.
        problem_key:
          type:
          - string
          - 'null'
          description: Selected problem option key within the current case type; null for legacy submissions.
        classification:
          $ref: '#/components/schemas/CaseClassification'
    CasesResponse:
      type: object
      additionalProperties: false
      required: [cases, next_cursor]
      properties:
        cases:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CaseListItem'
        next_cursor:
          type: [string, 'null']
          description: >-
            Opaque signed cursor for the next page in this user, house and scope, or null when no
            next page exists. Pagination is not a snapshot.
    Step:
      type: object
      additionalProperties: false
      required: [key, kind, status_key, title, description, sort_order]
      properties:
        key:
          type: string
          description: Stable technical key of this step within its Case type.
        kind:
          type: string
          description: Type of frontend component used to display this step.
        status_key:
          type: string
          enum: [new, in_progress, action_required, closed_by_executor, awaiting_recalculation, completed]
        title:
          type: string
        description:
          type: [string, 'null']
        sort_order:
          type: integer
    CaseTypeSummary:
      type: object
      additionalProperties: false
      required: [key, name, description]
      properties:
        key:
          type: string
          enum: [heating, elevator, yard, leak, hot_water, cold_water, electricity, other]
        name:
          type: string
        description:
          type: [string, 'null']
    CaseTypesResponse:
      type: object
      additionalProperties: false
      required: [case_types]
      properties:
        case_types:
          type: array
          description: >-
            Global catalog ordered heating, elevator, yard, leak, hot_water, cold_water,
            electricity, other; legacy demo aliases are excluded.
          items:
            $ref: '#/components/schemas/CaseTypeSummary'
    CaseConstructorOption:
      type: object
      additionalProperties: false
      required: [key, label, text]
      properties:
        key:
          type: string
        label:
          type: string
          description: Text shown for this selectable option.
        text:
          type: string
          description: >-
            Without input_label, substitute this text unchanged. With input_label, append the
            user's nonblank wording after this prefix with one space. The prefix supplies its
            own punctuation. An empty prefix means use only the user's wording, with no leading space.
        problem_keys:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            Present only on location options. Available only for the listed problem keys;
            omission means available for any problem. Clear the selected location if a problem
            change makes it unavailable.
          items:
            type: string
        input_label:
          type: string
          description: >-
            Label for a required custom-text input. Require nonblank user wording and combine
            it with this option's text prefix before substituting the field into the template.
    CaseConstructorField:
      type: object
      additionalProperties: false
      required: [key, label, options]
      properties:
        key:
          type: string
          enum: [problem, location]
        label:
          type: string
        options:
          type: array
          description: Choose one available option after applying any problem_keys restriction.
          items:
            $ref: '#/components/schemas/CaseConstructorOption'
    CaseConstructor:
      type: object
      additionalProperties: false
      required: [description_template, fields]
      description: >-
        Metadata for composing a description in the frontend. Render only the returned fields
        and filter location options by problem_keys. Fixed wording, including the elevator
        location, is already in the template. For options with input_label, require nonblank user
        wording and join it to a nonempty text prefix with one space; if the prefix is empty,
        use only the user's wording. Without input_label, use text unchanged. Replace each
        {field_key} placeholder with its resulting fragment, then allow manual edits and submit
        the final description. Structured answers are not submitted or stored, and the backend
        does not regenerate the description or validate constructor answers separately.
        Capture the start time once through the optional violation_started_at field; it is not
        a constructor question and is not inferred from answers or added to the description.
      properties:
        description_template:
          type: string
        fields:
          type: array
          description: >-
            Questions in display order, an ordered subset of problem and location.
            Elevator includes only problem; its location is fixed in the template.
          items:
            $ref: '#/components/schemas/CaseConstructorField'
    CaseType:
      type: object
      additionalProperties: false
      required: [key, name, description, constructor, steps]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        constructor:
          $ref: '#/components/schemas/CaseConstructor'
        steps:
          type: array
          description: Workflow steps ordered by sort_order; may be empty for an unconfigured type.
          items:
            $ref: '#/components/schemas/Step'
    CreateCase:
      type: object
      additionalProperties: true
      required:
      - case_type_key
      - problem_key
      - description
      - visibility
      description: JSON fields use the declared types. Additional properties are ignored. House, creator and
        initial workflow step are assigned by the backend. Upload files through multipart photos[] fields.
      properties:
        case_type_key:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
          description: Final description from the frontend, stored without trimming. Must not be blank.
        visibility:
          type: string
          enum:
          - public
          - private
          description: 'Required visibility: public Cases are visible to house members; private Cases only
            to their creator.'
        is_emergency:
          type: boolean
          default: false
          description: Optional JSON boolean. Omission means false.
        location_details:
          type:
          - string
          - 'null'
          description: Optional location within the house. Omission or null means no location.
        violation_started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional RFC3339 timestamp with a timezone. Omit it or use null when unknown.
        violation_ended_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional RFC3339 timestamp with a timezone, later than violation_started_at when both exist.
        photos:
          type: array
          maxItems: 0
          description: Omit this field or send an empty array in JSON; upload files through multipart/form-data.
        problem_key:
          type: string
          minLength: 1
          description: Required key from the selected constructor problem field. Unknown keys are rejected.
    CreateCaseWithPhotos:
      type: object
      additionalProperties: true
      required:
      - case_type_key
      - problem_key
      - description
      - visibility
      description: Multipart fields use strings and uploaded files. Additional properties are ignored. House, creator and
        initial workflow step are assigned by the backend. Upload files through multipart photos[] fields.
      properties:
        case_type_key:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
          description: Final description from the frontend, stored without trimming. Must not be blank.
        visibility:
          type: string
          enum:
          - public
          - private
          description: 'Required visibility: public Cases are visible to house members; private Cases only
            to their creator.'
        is_emergency:
          type: string
          enum: ['true', 'false']
          default: 'false'
          description: Optional multipart boolean text. Omission means false.
        location_details:
          type:
          - string
          - 'null'
          description: Optional location within the house. Omission or null means no location.
        violation_started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional RFC3339 timestamp with a timezone. Omit it when unknown.
        violation_ended_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional RFC3339 timestamp with a timezone, later than violation_started_at when both exist.
        photos:
          type: array
          maxItems: 5
          description: Optional uploaded JPEG, PNG, WebP, HEIC or HEIF images, up to five files and 10 MiB
            each. Content type is detected from the file contents.
          items:
            type: string
            format: binary
        problem_key:
          type: string
          minLength: 1
          description: Required key from the selected constructor problem field. Unknown keys are rejected.
    Photo:
      type: object
      additionalProperties: false
      required:
      - id
      - filename
      - content_type
      - byte_size
      - url
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
        filename:
          type: string
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
          - image/heic
          - image/heif
        byte_size:
          type: integer
          minimum: 1
          maximum: 10485760
        url:
          type: string
          pattern: ^/api/(?:dispatch/)?cases/[0-9]+/photos/[0-9]+$
          description: >-
            Relative protected photo URL requiring resident house access or assigned dispatcher access. No
            public Active Storage URL is exposed.
    CaseDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - case_type
      - title
      - description
      - is_emergency
      - location_details
      - created_at
      - last_activity_at
      - confirmation_count
      - confirmed_by_me
      - can_confirm
      - visibility
      - house
      - current_step
      - violation_started_at
      - violation_ended_at
      - is_creator
      - photos
      - problem_key
      - classification
      - workflow
      properties:
        workflow:
          description: Private workflow data for the creator or assigned dispatcher; null for neighbors.
          oneOf:
          - $ref: '#/components/schemas/CaseWorkflow'
          - type: 'null'
        id:
          type: string
          pattern: ^[0-9]+$
        case_type:
          type: object
          additionalProperties: false
          required:
          - key
          - name
          properties:
            key:
              type: string
            name:
              type: string
        title:
          type: string
          description: Server-derived title from the current problem option text, falling back to the case type name for legacy or free-text problems.
        description:
          type: string
        is_emergency:
          type: boolean
          description: Whether the resident marked this Case as an emergency.
        location_details:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
          description: Latest case event time, falling back to the Case creation time.
        confirmation_count:
          type: integer
          minimum: 0
          description: Number of subscribers, excluding the Case creator.
        confirmed_by_me:
          type: boolean
        can_confirm:
          type: boolean
          description: True for an active public Case created by another user that the current user has not
            confirmed.
        visibility:
          type: string
          enum:
          - public
          - private
        house:
          $ref: '#/components/schemas/House'
        current_step:
          $ref: '#/components/schemas/Step'
        violation_started_at:
          type:
          - string
          - 'null'
          format: date-time
        violation_ended_at:
          type:
          - string
          - 'null'
          format: date-time
        is_creator:
          type: boolean
          description: Whether the authenticated user created this Case and owns its workflow.
        photos:
          type: array
          maxItems: 5
          description: Attached photos; empty when no photos were uploaded.
          items:
            $ref: '#/components/schemas/Photo'
        problem_key:
          type:
          - string
          - 'null'
          description: Selected problem option key within the current case type; null for legacy submissions.
        classification:
          $ref: '#/components/schemas/CaseClassification'
    HomeResponse:
      type: object
      additionalProperties: false
      required: [viewer, house, active_cases_count, cases, next_cursor]
      properties:
        viewer:
          $ref: '#/components/schemas/HomeViewer'
        house:
          $ref: '#/components/schemas/House'
        active_cases_count:
          type: integer
          minimum: 0
        cases:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/HomeCase'
        next_cursor:
          type: [string, 'null']
    ConfirmationResponse:
      type: object
      additionalProperties: false
      required: [confirmation_count, confirmed_by_me, can_confirm]
      properties:
        confirmation_count:
          type: integer
          minimum: 1
          description: Number of subscribers, excluding the Case creator.
        confirmed_by_me:
          type: boolean
          const: true
        can_confirm:
          type: boolean
          const: false
    CaseEventActor:
      type: object
      additionalProperties: false
      required:
      - id
      - first_name
      - last_name
      properties:
        id:
          type: string
          pattern: "^[0-9]+$"
        first_name:
          type:
          - string
          - 'null'
        last_name:
          type:
          - string
          - 'null'
    CaseEvent:
      oneOf:
      - $ref: '#/components/schemas/CaseCreatedEvent'
      - $ref: '#/components/schemas/CaseConfirmationEvent'
      - $ref: '#/components/schemas/CaseMessageEvent'
      - $ref: '#/components/schemas/CaseStatusEvent'
      - $ref: '#/components/schemas/CaseClassificationEvent'
      - $ref: '#/components/schemas/CaseContractorEvent'
      - $ref: '#/components/schemas/CaseWorkStartedEvent'
      - $ref: '#/components/schemas/CaseWorkFinishedEvent'
      - $ref: '#/components/schemas/CaseClarificationRequestedEvent'
      - $ref: '#/components/schemas/CaseClarificationAnsweredEvent'
      - $ref: '#/components/schemas/CaseRepairConfirmedEvent'
      - $ref: '#/components/schemas/CaseRepairRejectedEvent'
      - $ref: '#/components/schemas/CaseRecalculationConfirmedEvent'
      - $ref: '#/components/schemas/CaseRecalculationMissingEvent'
      - $ref: '#/components/schemas/CaseRecalculationResumedEvent'
      - $ref: '#/components/schemas/CaseRecalculationRetriedEvent'
      - $ref: '#/components/schemas/CaseRecalculationSubmittedEvent'
      - $ref: '#/components/schemas/CaseRecalculationFailedEvent'
      discriminator:
        propertyName: event_type
        mapping:
          case_created: '#/components/schemas/CaseCreatedEvent'
          confirmation_added: '#/components/schemas/CaseConfirmationEvent'
          message_added: '#/components/schemas/CaseMessageEvent'
          status_changed: '#/components/schemas/CaseStatusEvent'
          classification_confirmed: '#/components/schemas/CaseClassificationEvent'
          contractor_assigned: '#/components/schemas/CaseContractorEvent'
          work_started: '#/components/schemas/CaseWorkStartedEvent'
          work_finished: '#/components/schemas/CaseWorkFinishedEvent'
          clarification_requested: '#/components/schemas/CaseClarificationRequestedEvent'
          clarification_answered: '#/components/schemas/CaseClarificationAnsweredEvent'
          repair_confirmed: '#/components/schemas/CaseRepairConfirmedEvent'
          repair_rejected: '#/components/schemas/CaseRepairRejectedEvent'
          recalculation_confirmed: '#/components/schemas/CaseRecalculationConfirmedEvent'
          recalculation_missing: '#/components/schemas/CaseRecalculationMissingEvent'
          recalculation_resumed: '#/components/schemas/CaseRecalculationResumedEvent'
          recalculation_retried: '#/components/schemas/CaseRecalculationRetriedEvent'
          recalculation_submitted: '#/components/schemas/CaseRecalculationSubmittedEvent'
          recalculation_failed: '#/components/schemas/CaseRecalculationFailedEvent'
      description: One approved history event. The backend emits only the documented data fields and omits
        unsupported legacy event types; actor is null for system or legacy events without an actor.
    CaseCreatedEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - event_type
      - occurred_at
      - actor
      - data
      properties:
        id:
          type: string
          pattern: "^[0-9]+$"
        event_type:
          type: string
          const: case_created
        occurred_at:
          type: string
          format: date-time
        actor:
          oneOf:
          - "$ref": "#/components/schemas/CaseEventActor"
          - type: 'null'
        data:
          type: object
          additionalProperties: false
          properties: {}
    CaseConfirmationEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - event_type
      - occurred_at
      - actor
      - data
      properties:
        id:
          type: string
          pattern: "^[0-9]+$"
        event_type:
          type: string
          const: confirmation_added
        occurred_at:
          type: string
          format: date-time
        actor:
          oneOf:
          - "$ref": "#/components/schemas/CaseEventActor"
          - type: 'null'
        data:
          type: object
          additionalProperties: false
          properties: {}
    CaseMessageEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - event_type
      - occurred_at
      - actor
      - data
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
        event_type:
          type: string
          const: message_added
        occurred_at:
          type: string
          format: date-time
        actor:
          oneOf:
          - $ref: '#/components/schemas/CaseEventActor'
          - type: 'null'
        data:
          type: object
          additionalProperties: false
          required:
          - body
          - sender_role
          properties:
            body:
              type: string
              minLength: 1
              maxLength: 5000
            sender_role:
              type: string
              description: >-
                Resident messages use resident; dispatcher replies use dispatcher. Historical events retain their stored sender role.
    CaseStatusEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - event_type
      - occurred_at
      - actor
      - data
      properties:
        id:
          type: string
          pattern: "^[0-9]+$"
        event_type:
          type: string
          const: status_changed
        occurred_at:
          type: string
          format: date-time
        actor:
          oneOf:
          - "$ref": "#/components/schemas/CaseEventActor"
          - type: 'null'
        data:
          type: object
          additionalProperties: false
          required:
          - from_step_key
          - to_step_key
          - from_status_key
          - to_status_key
          properties:
            from_step_key:
              type: string
            to_step_key:
              type: string
            from_status_key:
              type: string
              enum:
              - new
              - in_progress
              - action_required
              - closed_by_executor
              - awaiting_recalculation
              - completed
            to_status_key:
              type: string
              enum:
              - new
              - in_progress
              - action_required
              - closed_by_executor
              - awaiting_recalculation
              - completed
    CaseEventsResponse:
