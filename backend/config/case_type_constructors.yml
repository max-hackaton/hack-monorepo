heating:
  name: Отопление
  description: Проблемы с отоплением
  constructor:
    description_template: >-
      {problem}. Наблюдаю эту проблему {location}. Прошу зарегистрировать обращение,
      проверить работу отопления, зафиксировать результаты проверки и устранить выявленные
      неисправности. Прошу сообщить о принятых мерах и сроках устранения проблемы. Также прошу
      проверить правильность начислений за отопление и при наличии оснований произвести перерасчёт.
    fields:
      - key: problem
        label: Что происходит?
        options:
          - key: no_heating
            label: Нет отопления
            text: Отопление не работает
          - key: weak_heating
            label: Батареи едва тёплые
            text: Радиаторы отопления едва тёплые
          - key: uneven_heating
            label: Неравномерный нагрев
            text: Радиаторы отопления нагреваются неравномерно
          - key: other
            label: Другое
            text: ""
            input_label: Опишите, что произошло
      - key: location
        label: Где возникла проблема?
        options:
          - key: whole_apartment
            label: Во всей квартире
            text: во всей квартире
          - key: one_room
            label: Жилая комната
            text: в жилой комнате
          - key: kitchen
            label: Кухня
            text: на кухне
          - key: bathroom
            label: Ванная
            text: в ванной
